name: gitlab-platform

services:
  gitlab:
    image: ${GITLAB_IMAGE:?Set an approved GitLab image}
    hostname: ${GITLAB_HOSTNAME:?Set the public GitLab hostname}
    restart: unless-stopped
    shm_size: '256m'
    cpus: ${GITLAB_CPUS:-8}
    mem_limit: ${GITLAB_MEMORY:-16g}
    stop_grace_period: 2m
    environment:
      GITLAB_EXTERNAL_URL: ${GITLAB_EXTERNAL_URL:?Set the public HTTPS URL}
      GITLAB_SSH_PORT: ${GITLAB_SSH_PORT:-2222}
      GITLAB_TRUSTED_PROXIES: ${GITLAB_TRUSTED_PROXIES:?Set exact proxy addresses}
      GITLAB_OMNIBUS_CONFIG: |
        external_url ENV.fetch('GITLAB_EXTERNAL_URL')
        gitlab_rails['gitlab_shell_ssh_port'] = Integer(ENV.fetch('GITLAB_SSH_PORT'))
        letsencrypt['enable'] = false
        gitlab_rails['nginx']['listen_port'] = 80
        gitlab_rails['nginx']['listen_https'] = false
        gitlab_rails['nginx']['redirect_http_to_https'] = false
        gitlab_rails['nginx']['real_ip_trusted_addresses'] = ENV.fetch('GITLAB_TRUSTED_PROXIES').split(',').map(&:strip)
        gitlab_rails['nginx']['real_ip_header'] = 'X-Forwarded-For'
        gitlab_rails['nginx']['real_ip_recursive'] = 'on'
        gitlab_rails['trusted_proxies'] = ENV.fetch('GITLAB_TRUSTED_PROXIES').split(',').map(&:strip)
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/gitlab_root_password').strip
        gitlab_rails['backup_path'] = '/var/opt/gitlab/backups'
        gitlab_rails['backup_keep_time'] = 604800
    ports:
      - '${GITLAB_HTTP_BIND:-127.0.0.1}:${GITLAB_HTTP_PORT:-8929}:80'
      - '${GITLAB_SSH_BIND:-127.0.0.1}:${GITLAB_SSH_PORT:-2222}:22'
    volumes:
      - type: bind
        source: ${GITLAB_CONFIG_DIR:?Set an absolute Docker-host config path}
        target: /etc/gitlab
        bind:
          create_host_path: false
      - type: bind
        source: ${GITLAB_LOGS_DIR:?Set an absolute Docker-host logs path}
        target: /var/log/gitlab
        bind:
          create_host_path: false
      - type: bind
        source: ${GITLAB_DATA_DIR:?Set an absolute Docker-host data path}
        target: /var/opt/gitlab
        bind:
          create_host_path: false
      - type: bind
        source: ${GITLAB_BACKUPS_DIR:?Set an absolute Docker-host backup path}
        target: /var/opt/gitlab/backups
        bind:
          create_host_path: false
    secrets:
      - gitlab_root_password
    healthcheck:
      test: ['CMD', '/opt/gitlab/bin/gitlab-healthcheck', '--fail', '--max-time', '10']
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  runner:
    image: ${GITLAB_RUNNER_IMAGE:?Set an approved Runner image}
    profiles: ['runner']
    restart: unless-stopped
    stop_grace_period: 10m
    cpus: 1
    mem_limit: 512m
    environment:
      KUBECONFIG: /etc/gitlab-runner/kubernetes/config
    volumes:
      - type: bind
        source: ${GITLAB_RUNNER_CONFIG_DIR:?Set an absolute Docker-host Runner config path}
        target: /etc/gitlab-runner
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop: ['ALL']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

secrets:
  gitlab_root_password:
    file: ${GITLAB_ROOT_PASSWORD_FILE:?Set an absolute Docker-host secret file}
