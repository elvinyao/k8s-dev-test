input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/tls/server.crt"
    ssl_key => "/usr/share/logstash/config/tls/server.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/tls/ca.crt"]
    ssl_client_authentication => "required"
  }
  http {
    port => 8443
    codec => json
    max_content_length => 1048576
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/tls/server.crt"
    ssl_key => "/usr/share/logstash/config/tls/server.key"
    user => "collector"
    password => "${INGEST_PASSWORD}"
  }
}

filter {
  # Keep a fixed target index; senders cannot choose arbitrary Elasticsearch indices.
  mutate { add_field => { "[event][dataset]" => "platform" } }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    ssl_enabled => true
    ssl_verification_mode => "full"
    ssl_certificate_authorities => ["/usr/share/logstash/config/tls/ca.crt"]
    user => "logstash_writer"
    password => "${LOGSTASH_PASSWORD}"
    index => "platform-logs-%{+yyyy.MM.dd}"
    action => "create"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}

