apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
  namespace: apps-dev
  labels:
    app.kubernetes.io/name: storage-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: writer
      image: busybox:1.37.0
      command:
        - sh
        - -ec
        - 'test -f /data/marker || date -u > /data/marker; while true; do sleep 3600; done'
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      readinessProbe:
        exec: {command: [test, -s, /data/marker]}
        initialDelaySeconds: 2
        periodSeconds: 5
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: storage-demo}
