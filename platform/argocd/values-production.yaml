# Configure domains/OIDC before deployment; see docs/production.md.
global:
  domain: argocd.example.invalid
  affinity:
    podAntiAffinity: hard
configs:
  secret:
    createSecret: false
  params:
    server.insecure: true
  cm:
    url: https://argocd.example.invalid
    admin.enabled: false
    users.anonymous.enabled: false
    oidc.config: |
      name: Platform SSO
      issuer: https://sso.example.invalid/realms/platform
      clientID: argocd
      clientSecret: $oidc.platform.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
  rbac:
    policy.default: role:no-access
    scopes: '[groups]'
    policy.csv: |
      g, platform-admins, role:admin
      p, role:app-developer, applications, get, platform-apps-production/*, allow
      p, role:app-developer, applications, sync, platform-apps-production/*, allow
      p, role:app-developer, logs, get, platform-apps-production/*, allow
      g, app-developers, role:app-developer
dex:
  enabled: false
redis:
  enabled: false
redis-ha:
  enabled: true
  replicas: 3
  hardAntiAffinity: true
  haproxy:
    enabled: true
    replicas: 3
  persistentVolume:
    enabled: false
controller:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
repoServer:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  pdb: {enabled: true, minAvailable: 1}
server:
  replicas: 2
  service: {type: ClusterIP}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  pdb: {enabled: true, minAvailable: 1}
applicationSet:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
notifications:
  enabled: false
