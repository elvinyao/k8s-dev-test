apiVersion: v1
kind: ServiceAccount
metadata:
  name: logging-filebeat
  labels:
    app.kubernetes.io/component: foundation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-logging-filebeat
  labels:
    app.kubernetes.io/component: foundation
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-logging-filebeat
  labels:
    app.kubernetes.io/component: foundation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-logging-filebeat
subjects:
  - kind: ServiceAccount
    name: logging-filebeat
    namespace: logging
