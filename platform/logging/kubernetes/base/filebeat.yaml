apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: logging-filebeat
  labels:
    app.kubernetes.io/component: collection
spec:
  type: filebeat
  version: 9.5.4
  config:
    logging.level: info
    logging.to_files: false
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs
        paths: [/var/log/containers/*.log]
        prospector.scanner.symlinks: true
        parsers:
          - container:
              stream: all
              format: auto
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
    output.logstash:
      hosts: [logging-logstash-ls-beats.logging.svc:5044]
      loadbalance: true
      workers: 2
      # Periodically reopen persistent connections to distribute them over
      # both Service endpoints. Pipelining must be disabled when TTL is used.
      ttl: 5m
      pipelining: 0
      ssl:
        enabled: true
        verification_mode: full
        certificate_authorities: [/usr/share/filebeat/beats-tls/ca.crt]
        certificate: /usr/share/filebeat/beats-tls/tls.crt
        key: /usr/share/filebeat/beats-tls/tls.key
        supported_protocols: [TLSv1.2, TLSv1.3]
  daemonSet:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: filebeat
      spec:
        serviceAccountName: logging-filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 60
        nodeSelector:
          kubernetes.io/os: linux
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: beat-data
                mountPath: /usr/share/filebeat/data
              - name: beats-tls
                mountPath: /usr/share/filebeat/beats-tls
                readOnly: true
              - name: temp
                mountPath: /tmp
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
              type: Directory
          - name: varlogpods
            hostPath:
              path: /var/log/pods
              type: Directory
          - name: beat-data
            hostPath:
              path: /var/lib/platform-filebeat
              type: DirectoryOrCreate
          - name: beats-tls
            secret:
              secretName: logging-filebeat-client-tls
              defaultMode: 0400
          - name: temp
            emptyDir:
              sizeLimit: 64Mi
