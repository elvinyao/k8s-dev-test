# Required external inputs shared by live preflight and rendered dependency checks.
# Contains names/keys only. Supply values privately in the gitlab namespace.
external:
  gitlab-initial-root-password: [password]
  gitlab-postgresql: [password]
  gitlab-postgresql-tls: [ca.crt, tls.crt, tls.key]
  gitlab-redis: [password]
  gitlab-backend-ca: [backend-ca.crt]
  gitlab-gitaly-token: [token]
  gitlab-shell-token: [secret]
  gitlab-object-storage: [connection]
  gitlab-backup-storage: [config]
  gitlab-smtp: [password]
registryOverlay:
  gitlab-registry-storage: [config]
# Audited against the pinned chart 10.4.1 shared-secrets/selfsign hooks.
# These hooks must actually succeed at installation; rendering does not prove it.
generatedByChartHooks:
  - gitlab-gitlab-shell-host-keys
  - gitlab-gitlab-workhorse-secret
  - gitlab-rails-secret
  - gitlab-registry-notification
  - gitlab-registry-secret
  - gitlab-registry-httpsecret
  - gitlab-wildcard-tls-ca
