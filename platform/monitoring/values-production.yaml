defaultRules:
  create: true
grafana:
  replicas: 1
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_SECURITY_SECRET_KEY:
      secretKeyRef:
        name: grafana-encryption
        key: secret-key
  service: {type: ClusterIP}
  persistence:
    enabled: true
    type: pvc
    storageClassName: production-rwo
    accessModes: [ReadWriteOnce]
    size: 10Gi
  deploymentStrategy: {type: Recreate}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  grafana.ini:
    server:
      root_url: https://grafana.example.invalid
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
prometheus:
  service: {type: ClusterIP}
  prometheusSpec:
    replicas: 2
    retention: 15d
    retentionSize: 40GB
    walCompression: true
    externalLabels: {cluster: production}
    podAntiAffinity: hard
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "4", memory: 4Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: production-rwo
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 50Gi}
alertmanager:
  service: {type: ClusterIP}
  alertmanagerSpec:
    replicas: 3
    configSecret: alertmanager-config
    podAntiAffinity: hard
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: production-rwo
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 5Gi}
prometheusOperator:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
# Managed clusters usually hide these endpoints. Enable only with working targets.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
