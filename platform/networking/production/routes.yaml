apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: gateway-system
      sectionName: https
  hostnames: [argocd.example.invalid]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: gateway-system
      sectionName: https
  hostnames: [grafana.example.invalid]
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
